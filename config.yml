  # --- Workday-based ---
  # RAND: open RAND careers, click any job; if the URL looks like
  #   https://rand.wd1.myworkdayjobs.com/SOMETHING/job/... then un-comment
  #   and replace External_Career_Site with SOMETHING.
  # - {name: RAND, board: workday, tenant: rand, host: wd1, site: External_Career_Site}

# ----------------------------------------------------------------------------
usajobs:
  enabled: true
  search_terms: ["behavioral scientist", "social scientist", "survey statistician", "policy analyst", "research psychologist", "program evaluation"]
  locations: ["Los Angeles, California", "Washington, DC"]
  remote_ok: true

adzuna:
  enabled: true
  queries:
    - "behavioral scientist"
    - "trust and safety research"
    - "quantitative UX researcher"
    - "survey scientist"
    - "people analytics"
    - "consumer insights research"
    - "public opinion research"
    - "program evaluation"
    - "experimentation data scientist"
  where: "Los Angeles"
  max_per_query: 10

eightyk:
  enabled: false

# ============================================================================
# SCORING — title keywords sum; location contributes ONE capped boost (max
# value among matches, ceiling +3). A posting must have positive title score.
# ============================================================================
scoring:
  core_threshold: 10
  adjacent_threshold: 6

  location_boosts:
    los angeles: 3
    remote: 3
    "new york": 2
    washington: 2
    san francisco: 2

  weights:
