# ============================================================================
# JOB MONITOR CONFIG
# Boards: greenhouse | lever | ashby | workday
# Slug = ID in careers URL: boards.greenhouse.io/<slug> | jobs.lever.co/<slug>
#   | jobs.ashbyhq.com/<slug>
# Workday: <tenant>.<host>.myworkdayjobs.com/<site>
# Wrong slugs error harmlessly (listed in digest footer) — delete or fix them.
# ============================================================================

companies:
  # --- AI labs / frontier ---
  - {name: Anthropic,        board: greenhouse, slug: anthropic}
  - {name: OpenAI,           board: ashby,      slug: openai}
  - {name: Google DeepMind,  board: greenhouse, slug: deepmind}
  - {name: Scale AI,         board: greenhouse, slug: scaleai}
  - {name: Cohere,           board: ashby,      slug: cohere}
  - {name: Mistral AI,       board: lever,      slug: mistral}
  - {name: xAI,              board: greenhouse, slug: xai}

  # --- AI safety / research orgs (mission-aligned, some below comp floor) ---
  - {name: Open Philanthropy, board: greenhouse, slug: openphilanthropy}
  - {name: Epoch AI,          board: ashby,      slug: epochai}
  - {name: METR,              board: ashby,      slug: metr}
  - {name: Redwood Research,  board: lever,      slug: redwoodresearch}

  # --- Tech with T&S / integrity / behavioral / research teams ---
  - {name: Discord,          board: greenhouse, slug: discord}
  - {name: Reddit,           board: greenhouse, slug: reddit}
  - {name: Pinterest,        board: greenhouse, slug: pinterest}
  - {name: Twitch,           board: greenhouse, slug: twitch}
  - {name: Duolingo,         board: greenhouse, slug: duolingo}
  - {name: Figma,            board: greenhouse, slug: figma}
  - {name: Stripe,           board: greenhouse, slug: stripe}
  - {name: Airbnb,           board: greenhouse, slug: airbnb}
  - {name: Lyft,             board: greenhouse, slug: lyft}
  - {name: Robinhood,        board: greenhouse, slug: robinhood}
  - {name: Notion,           board: ashby,      slug: notion}
  - {name: Spotify,          board: lever,      slug: spotify}
  - {name: Grammarly,        board: greenhouse, slug: grammarly}
  - {name: Coinbase,         board: greenhouse, slug: coinbase}
  - {name: DoorDash,         board: greenhouse, slug: doordashusa}
  - {name: Instacart,        board: greenhouse, slug: instacart}
  - {name: Waymo,            board: greenhouse, slug: waymo}
  - {name: Code for America, board: greenhouse, slug: codeforamerica}

  # --- Workday-based ---
  # RAND: to enable, open RAND's careers site, click any job, copy the URL:
  #   https://rand.wd1.myworkdayjobs.com/SOMETHING/job/...
  # Un-comment the line below and replace External_Career_Site with SOMETHING.
  # - {name: RAND, board: workday, tenant: rand, host: wd1, site: External_Career_Site}

# ----------------------------------------------------------------------------
usajobs:
  enabled: true
  search_terms: ["behavioral scientist", "social scientist", "survey statistician", "policy analyst"]
  locations: ["Los Angeles, California", "Washington, DC"]
  remote_ok: true

adzuna:
  enabled: true
  queries: ["behavioral scientist", "trust and safety research", "quantitative UX researcher", "survey scientist"]
  where: "Los Angeles"
  max_per_query: 10

eightyk:
  enabled: false

# ============================================================================
# SCORING
# ============================================================================
