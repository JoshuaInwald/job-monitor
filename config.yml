# ============================================================================
# JOB MONITOR CONFIG — edit freely, plain text
# ============================================================================
# Boards: greenhouse | lever | ashby | workday
# To find a company's slug: open its careers page and look at the URL —
#   boards.greenhouse.io/<slug> | jobs.lever.co/<slug> | jobs.ashbyhq.com/<slug>
# Workday entries need three parts, visible in the careers URL:
#   <tenant>.<host>.myworkdayjobs.com/<site>
# ============================================================================

companies:
  # --- AI labs / frontier ---
  - {name: Anthropic,        board: greenhouse, slug: anthropic}
  - {name: OpenAI,           board: ashby,      slug: openai}
  - {name: Google DeepMind,  board: greenhouse, slug: deepmind}
  - {name: Scale AI,         board: greenhouse, slug: scaleai}
  - {name: Cohere,           board: ashby,      slug: cohere}
  - {name: Mistral AI,       board: lever,      slug: mistral}
  - {name: xAI,              board: greenhouse, slug: xai}

  # --- Tech with trust & safety / integrity / behavioral teams ---
  - {name: Discord,          board: greenhouse, slug: discord}
  - {name: Reddit,           board: greenhouse, slug: reddit}
  - {name: Pinterest,        board: greenhouse, slug: pinterest}
  - {name: Twitch,           board: greenhouse, slug: twitch}
  - {name: Duolingo,         board: greenhouse, slug: duolingo}
  - {name: Figma,            board: greenhouse, slug: figma}
  - {name: Stripe,           board: greenhouse, slug: stripe}
  - {name: Airbnb,           board: greenhouse, slug: airbnb}
  - {name: Lyft,             board: greenhouse, slug: lyft}
  - {name: Robinhood,        board: greenhouse, slug: robinhood}
  - {name: Notion,           board: ashby,      slug: notion}
  - {name: Code for America, board: greenhouse, slug: codeforamerica}

  # --- Workday-based ---
  # RAND: my site-name guess failed. To fix: open RAND's careers site, click
  # any job, copy the URL. If it looks like
  #   https://rand.wd1.myworkdayjobs.com/SOMETHING/job/...
  # then un-comment the line below (delete the leading "# ") and replace
  # External_Career_Site with that SOMETHING segment, exactly as written.
  # - {name: RAND, board: workday, tenant: rand, host: wd1, site: External_Career_Site}

# ----------------------------------------------------------------------------
# USAJobs (federal roles). FREE key: https://developer.usajobs.gov/apirequest
# Then add repo secrets USAJOBS_EMAIL and USAJOBS_KEY (README Step 5).
# Skipped harmlessly until secrets exist.
usajobs:
  enabled: true
  search_terms: ["behavioral scientist", "social scientist", "survey statistician", "policy analyst"]
  locations: ["Los Angeles, California", "Washington, DC"]
  remote_ok: true

# ----------------------------------------------------------------------------
# Adzuna (aggregator). FREE key: https://developer.adzuna.com
# Add secrets ADZUNA_APP_ID and ADZUNA_APP_KEY. Skipped until secrets exist.
adzuna:
  enabled: true
  queries: ["behavioral scientist", "trust and safety research", "quantitative UX researcher", "survey scientist"]
  where: "Los Angeles"
  max_per_query: 10

# ----------------------------------------------------------------------------
# 80,000 Hours board — disabled until I find their correct endpoint.
eightyk:
  enabled: false

# ============================================================================
# SCORING — weighted keywords. Score = sum of matching term weights
# (title + location). Tiers: >= core_threshold -> "Core"; adjacent_threshold
# up to core -> "Adjacent"; below -> ignored. hard_exclude kills outright.
# ============================================================================
scoring:
  core_threshold: 10
  adjacent_threshold: 6

  weights:
    # --- bullseye ---
    behavioral science: 12
    behavioral scientist: 12
    behavioural: 10
    societal impacts: 12
    trust and safety: 10
    "trust & safety": 10
    safeguards: 10
    responsible ai: 9
    ai policy: 10
    ai governance: 9
    policy research: 9
    research scientist: 8
    quantitative researcher: 9
    quantitative ux: 10
    survey: 8
    survey methodologist: 12
    social science: 9
    misinformation: 9
    election: 8
    civic: 7
    risk perception: 12
    climate: 6
    persuasion: 9

    # --- solid ---
    ux researcher: 6
    user researcher: 6
    policy analyst: 7
    public policy: 7
    data scientist: 5
    research manager: 6
    people analytics: 6
    insights: 4
    applied scientist: 4
    decision science: 8
    experimentation: 5
    integrity: 6
    platform policy: 8
    content policy: 7
    safety: 4

    # --- adjacent ---
    market research: 4
    strategy: 3
    program manager: 3
    data analyst: 3
    research associate: 3
    policy advisor: 5
    sustainability: 3

    # --- location boosts ---
    los angeles: 3
    remote: 3
    "new york": 2
    washington: 2
    san francisco: 2

    # --- demotions ---
    machine learning: -5
    deep learning: -6
    pretraining: -10
    inference: -6
    infrastructure: -8
    frontend: -10
    backend: -10
    full stack: -10
    finance: -4
    accounting: -8
    marketing: -2
    legal counsel: -8
    counsel: -6
    physician: -10
    clinical: -6
    nurse: -10

  hard_exclude:
    - intern
    - internship
    - co-op
    - software engineer
    - staff engineer
    - security engineer
    - site reliability
    - hardware
    - account executive
    - account manager
    - sales
    - recruiter
    - sourcer
    - executive assistant
    - administrative assistant
    - customer support
    - customer success
    - solutions architect
    - warehouse
    - driver
