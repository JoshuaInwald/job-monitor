# ============================================================================
# JOB MONITOR CONFIG
# Boards: greenhouse | lever | ashby | workday
# Slug = ID in careers URL: boards.greenhouse.io/<slug> | jobs.lever.co/<slug>
#   | jobs.ashbyhq.com/<slug>
# Wrong slugs error harmlessly (digest footer) — to fix one: open the org's
# careers page, click any job, read the URL; it names the board and slug.
# ============================================================================

